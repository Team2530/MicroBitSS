<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRC Timer Settings</title>
    <style>
        body {
            background-color: #3b3a3a;
            color: white;
            font-family: sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            border-bottom: 2px solid #555;
            padding-bottom: 10px;
        }
        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }
        input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #222;
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: 2px solid #00ff88;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #00ff88;
            color: #222;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #00cc6e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Settings</h2>
        
        <div class="input-group">
            <label for="control-mode">Control Method:</label>
            <select id="control-mode">
                <option value="microbit">Micro:bit Mode (Basic: Teleop & Fouls)</option>
                <option value="bluetooth">Bluetooth Controller (Advanced Breakdown)</option>
            </select>
        </div>

        <div class="divider"></div>

        
        <div class="input-group">
            <label for="team1">Team 1 Name:</label>
            <input type="text" id="team1" placeholder="Leave blank for default">
        </div>
        <div class="input-group">
            <label for="team2">Team 2 Name:</label>
            <input type="text" id="team2" placeholder="Leave blank for default">
        </div>
        <div class="input-group">
            <label for="team3">Team 3 Name:</label>
            <input type="text" id="team3" placeholder="Leave blank for default">
        </div>
        <div class="input-group">
            <label for="team4">Team 4 Name:</label>
            <input type="text" id="team4" placeholder="Leave blank for default">
        </div>
        <div class="input-group">
            <label for="team5">Team 5 Name:</label>
            <input type="text" id="team5" placeholder="Leave blank for default">
        </div>
        <div class="input-group">
            <label for="team6">Team 6 Name:</label>
            <input type="text" id="team6" placeholder="Leave blank for default">
        </div>

        <button id="save-btn">Save & Apply Settings</button>
        <div style="text-align: center; margin-top: 15px;">
            <img src="team-icons/SQRT.jpg" alt="SQRT" style="max-width: 60%;">
        </div>
    </div>

    <script src="settings.js"></script>
</body>
</html>
